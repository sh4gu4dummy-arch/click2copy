<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Click2Copy</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <div class="update-banner" id="update-banner" hidden role="status" aria-live="polite">
      <span class="update-banner-text" id="update-banner-text">Update ready — Restart</span>
      <div class="update-banner-actions">
        <button type="button" class="btn btn-primary" id="btn-update-restart">Restart</button>
        <button type="button" class="btn btn-secondary" id="btn-update-dismiss" title="Dismiss for now">Dismiss</button>
      </div>
    </div>
    <header class="header">
      <h1>Click2Copy <span class="app-version" id="app-version"></span></h1>
      <p class="subtitle">Build prompts from parts — click to append</p>
    </header>

    <section class="documents-section" aria-label="Prompt documents">
      <span class="documents-label">Prompt files</span>
      <div class="document-bar" id="document-bar" role="tablist" aria-label="Open prompt documents"></div>
    </section>

    <section class="separator-section" aria-label="Append separators">
      <label class="separator-control">
        <span>Part separator</span>
        <textarea id="part-separator" class="separator-input" rows="1" spellcheck="false" aria-label="Part separator" title="Used between separate append actions. Use \n for a newline."></textarea>
      </label>
      <label class="separator-control">
        <span>Column separator</span>
        <textarea id="column-separator" class="separator-input" rows="1" spellcheck="false" aria-label="Column separator" title="Used between non-empty cells in a row."></textarea>
      </label>
      <label class="separator-control">
        <span>Row separator</span>
        <textarea id="row-separator" class="separator-input" rows="1" spellcheck="false" aria-label="Row separator" title="Used between non-empty rows. Use \n for a newline."></textarea>
      </label>
    </section>

    <section class="tabs-section">
      <div class="tab-bar" id="tab-bar" role="tablist">
        <button type="button" class="btn btn-icon" id="btn-add-tab" title="Add tab">+</button>
      </div>
    </section>

    <section class="part-section">
      <div class="section-label-row">
        <label class="section-label" id="part-label">Part content</label>
        <div class="part-actions">
          <div class="row-filter-buttons" role="group" aria-label="Row filters">
            <button type="button" class="btn btn-secondary row-filter-btn is-active" id="btn-filter-all" data-filter="all" title="Show all rows">All</button>
            <button type="button" class="btn btn-secondary row-filter-btn" id="btn-filter-nonempty" data-filter="nonempty" title="Hide empty rows">Non-empty</button>
            <button type="button" class="btn btn-secondary row-filter-btn" id="btn-filter-included" data-filter="included" title="Show only rows included in Combined">In Combined</button>
          </div>
          <button type="button" class="btn btn-secondary" id="btn-add-row" title="Add a row of cells">+ Row</button>
          <button type="button" class="btn btn-secondary" id="btn-add-col" title="Add a column of cells">+ Column</button>
          <button type="button" class="btn btn-secondary" id="btn-rename-tab" title="Rename active tab">Rename</button>
          <button type="button" class="btn btn-danger" id="btn-delete-tab" title="Delete active tab">Delete</button>
        </div>
      </div>
      <details class="master-library" id="master-library">
        <summary>Master parts <span class="master-library-hint">— click a cell to add it to this part</span></summary>
        <div class="master-library-items" id="master-library-items"></div>
      </details>
      <div class="cell-grid-wrap">
        <div class="cell-grid" id="cell-grid" role="grid" aria-labelledby="part-label"></div>
      </div>
      <div class="actions-row">
        <button type="button" class="btn btn-primary" id="btn-append" title="Append every non-empty cell that is not slept">Append all active</button>
      </div>
    </section>

    <div class="section-resizer" id="combined-resizer" role="separator" aria-orientation="horizontal" aria-label="Resize combined prompt height" tabindex="0" title="Drag to resize combined prompt"></div>

    <section class="combined-section">
      <div class="section-label-row">
        <div class="combined-title">
          <label class="section-label" for="combined-prompt">Combined prompt</label>
          <label class="global-toggle" title="Share appended text across all parts">
            <input type="checkbox" id="global-combined" checked />
            <span>Global</span>
          </label>
        </div>
        <div class="combined-actions">
          <button type="button" class="btn btn-secondary" id="btn-export" title="Export all tabs and prompt to a JSON file">Export</button>
          <button type="button" class="btn btn-secondary" id="btn-import" title="Import tabs and prompt from a JSON backup">Import</button>
          <div class="clear-undo-stack">
            <button type="button" class="btn btn-secondary" id="btn-clear">Clear</button>
            <button type="button" class="btn btn-secondary" id="btn-undo-clear" hidden>Undo last clear</button>
          </div>
          <button type="button" class="btn btn-primary" id="btn-copy">Copy</button>
        </div>
      </div>
      <div id="combined-prompt" class="textarea textarea-combined is-empty" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Combined prompt" data-placeholder="Combined prompt appears here…" spellcheck="false"></div>
      <div class="status-row">
        <button type="button" class="status" id="status" aria-live="polite" aria-expanded="false" aria-controls="status-panel" title="Click for event log and under-the-hood details"></button>
        <div class="status-panel" id="status-panel" hidden>
          <div class="status-panel-header">
            <strong>Under the hood</strong>
            <button type="button" class="btn btn-secondary status-panel-close" id="status-panel-close" title="Close details">Close</button>
          </div>
          <div class="status-snapshot" id="status-snapshot"></div>
          <div class="status-events-label">Recent events</div>
          <ol class="status-events" id="status-events" reversed></ol>
        </div>
      </div>
    </section>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
